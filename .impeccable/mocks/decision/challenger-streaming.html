<!doctype html>
<html><head><meta charset="utf-8"><title>Title Card Wall sketch</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;background:#0e0f11;font-family:"Helvetica Neue",Arial,sans-serif;color:#f2f2f2;overflow:hidden;position:relative}
  .feat{position:absolute;inset:0 0 300px 0;background:linear-gradient(90deg,#0e0f11 30%,#24272c)}
  h1{position:absolute;left:80px;top:170px;font-size:140px;letter-spacing:-.05em;line-height:.9}
  p{position:absolute;left:84px;top:330px;width:560px;font-size:21px;line-height:1.5;color:#c4c6ca}
  .act{position:absolute;left:84px;top:440px;display:flex;gap:12px}
  .act span{height:52px;padding:0 26px;display:flex;align-items:center;font-weight:700;background:#f2f2f2;color:#0e0f11;border-radius:6px}
  .act span+span{background:#3a3d42;color:#f2f2f2}
  .row{position:absolute;left:80px;top:640px;font-size:22px;font-weight:700}
  .tiles{position:absolute;left:80px;top:684px;display:flex;gap:14px}
  .t{width:300px;height:180px;background:#24272c;border-radius:6px}
  .t.on{width:360px;height:210px;transform:translateY(-15px);outline:3px solid #3b82f6}
</style></head><body>
<div class="feat"></div>
<h1>Navin</h1>
<p>Computer Science student at LPU Manila. Front-end, UI, and a 92 wpm typing run you can race.</p>
<div class="act"><span>Race my 92 wpm</span><span>Email me</span></div>
<div class="row">Projects</div>
<div class="tiles"><div class="t on"></div><div class="t"></div><div class="t"></div><div class="t"></div></div>
</body></html>
