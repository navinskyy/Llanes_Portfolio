<!doctype html>
<html><head><meta charset="utf-8"><title>Type Specimen sketch</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;background:#f7f7f5;font-family:"Helvetica Neue",Arial,sans-serif;color:#0b0b0b;overflow:hidden;position:relative}
