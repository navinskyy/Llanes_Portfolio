<!doctype html>
<html><head><meta charset="utf-8"><title>Exhibition sketch</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#111;overflow:hidden;position:relative}
  .top{position:absolute;left:80px;right:80px;top:40px;display:flex;justify-content:space-between;font-size:15px}
  h1{position:absolute;left:80px;top:260px;font-size:180px;letter-spacing:-.05em;line-height:.9;font-weight:500}
  .wall{position:absolute;left:84px;top:470px;width:520px;font-size:20px;line-height:1.55;color:#333}
  .label{position:absolute;left:84px;top:680px;font-size:14px;line-height:1.5;color:#8c8c8c}
  .act{position:absolute;left:84px;top:600px;display:flex;gap:12px}
  .act span{height:48px;padding:0 24px;display:flex;align-items:center;font-weight:600;border:1px solid #111}
  .act span:first-child{background:#111;color:#fff}
  .work{position:absolute;right:-60px;top:160px;width:520px;height:620px;background:#e2e2e2}
  .room{position:absolute;right:500px;bottom:40px;font-size:14px;color:#8c8c8c}
</style></head><body>
<div class="top"><span>Navin Byron Llanes</span><span>Works · Rooms · Contact</span></div>
<h1>Navin</h1>
<p class="wall">Computer Science student and working student. Front-end development, UI design, and a growing interest in networking.</p>
<div class="act"><span>Race my 92 wpm</span><span>Email me</span></div>
<p class="label">Room 1 — Projects, 2023–2026</p>
<div class="work"></div>
</body></html>
